services:
  - type: web
    name: sentinel-live-backend
    runtime: node
    plan: starter
    buildCommand: node --version
    startCommand: node src/server.mjs
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    disk:
      name: sentinel-history
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: APP_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/sentinel.sqlite
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DEFENDER_USER
        value: defender
      - key: DEFENDER_PASSWORD
        sync: false
      - key: ATTACKER_USER
        value: attacker
      - key: ATTACKER_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
